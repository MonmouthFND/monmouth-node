[package]
name = "monmouth-svm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Monmouth SVM module — native Solana Virtual Machine execution"

[lints]
workspace = true

[dependencies]
# Solana SVM core
solana-svm = { version = "=3.1.9", features = [] }
solana-svm-callback = { version = "=3.1.9", features = ["agave-unstable-api"] }
solana-svm-transaction = { version = "=3.1.9", features = ["agave-unstable-api"] }

# Solana runtime
solana-program-runtime = { version = "=3.1.9", features = ["agave-unstable-api"] }
solana-system-program = { version = "=3.1.9", features = ["agave-unstable-api"] }
solana-bpf-loader-program = { version = "=3.1.9", features = ["agave-unstable-api"] }
solana-compute-budget-program = { version = "=3.1.9", features = ["agave-unstable-api"] }
agave-syscalls = { version = "=3.1.9", features = ["agave-unstable-api"] }

# Solana types
solana-account = "3.2"
solana-pubkey = "3.0"
solana-clock = "3.0"
solana-rent = "3.0"
solana-epoch-schedule = "3.0"
solana-hash = "3.1"
solana-sdk-ids = "3.0"
solana-feature-set = "2.2"
solana-fee-structure = "3.0"
solana-transaction = { version = "3.0", features = ["blake3"] }
solana-message = "3.0"

# Storage
monmouth-qmdb.workspace = true

# Alloy
alloy-primitives.workspace = true

# Serialization (for sysvars)
bincode = "1.3"

# Crypto
sha2 = "0.10"

# Error handling
thiserror.workspace = true

# Tracing
tracing.workspace = true

[dev-dependencies]
sha2 = "0.10"
solana-pubkey = { version = "3.0", features = ["rand"] }
solana-keypair = "3.0"
solana-signature = { version = "3.1", features = ["rand"] }
solana-signer = "3.0"
solana-system-transaction = "3.0"
solana-native-token = "3.0"
solana-transaction = { version = "3.0", features = ["dev-context-only-utils"] }
