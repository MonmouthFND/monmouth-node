[advisories]
ignore = [
    # paste is a transitive dep from alloy-primitives
    "RUSTSEC-2024-0436",
    # bincode 1.x is unmaintained but complete; transitive dep from solana-svm
    "RUSTSEC-2025-0141",
    # derivative is unmaintained; transitive dep from solana-svm
    "RUSTSEC-2024-0388",
    # libsecp256k1 is unmaintained; transitive dep from agave-syscalls.
    # No safe upgrade available. Not used for our own signing — the attestation,
    # delegation, and executor crates all use k256. Only reachable through the
    # SVM's secp256k1_recover syscall.
    "RUSTSEC-2025-0161",
    # proc-macro-error2 is unmaintained; transitive dep from alloy-sol-macro.
    # No safe upgrade available. Build-time only — not linked into the node.
    "RUSTSEC-2026-0173",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"
skip = [
    "block-buffer",
    "digest",
    "getrandom",
    "windows-sys",
    "windows-link",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
